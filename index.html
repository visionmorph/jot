<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A static design prototype for a user interface component authoring tool."
    />
    <title>Component Authoring Tool</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="authoring-shell">
      <aside class="left-sidebar" aria-label="Component and layer navigation">
        <section class="sidebar-panel components-panel" aria-labelledby="components-heading">
          <div class="panel-heading-wrap">
            <h1 class="panel-heading" id="components-heading">Components</h1>
          </div>

          <div class="contained-list" role="list">
            <div class="contained-list-item is-selected" role="listitem" aria-current="true">
              Button
            </div>
          </div>

          <button class="export-button" type="button" data-export-components>Export</button>
        </section>

        <div
          class="sidebar-divider"
          role="separator"
          aria-label="Resize Components and Layers panels"
          aria-orientation="horizontal"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="50"
        ></div>

        <section class="sidebar-panel layers-panel" aria-labelledby="layers-heading">
          <div class="panel-heading-wrap">
            <h2 class="panel-heading" id="layers-heading">Layers</h2>
          </div>

          <div class="tree-view" role="tree" aria-label="Layers" data-tree-view></div>
        </section>
      </aside>

      <section class="canvas" id="canvas" aria-label="Canvas">
        <div class="toolbar" role="toolbar" aria-label="Canvas tools">
          <button class="tool-button is-toggled" type="button" aria-label="Select" aria-pressed="true" data-tool="select">
            <span class="cursor-icon" aria-hidden="true"></span>
          </button>
          <button class="tool-button" type="button" aria-label="Frame" aria-pressed="false" data-tool="frame">
            <span class="square-icon square-icon--large" aria-hidden="true"></span>
          </button>
          <button class="tool-button" type="button" aria-label="Text" aria-pressed="false" data-tool="text">
            <span class="toolbar-text-icon" aria-hidden="true">T</span>
          </button>
        </div>
      </section>

      <aside class="right-sidebar" aria-label="Inspector">
        <section class="sidebar-panel page-panel" aria-labelledby="page-heading" data-page-inspector>
          <div class="panel-heading-wrap">
            <h2 class="panel-heading" id="page-heading">Page</h2>
          </div>
          <div class="color-picker-field">
            <label class="color-picker-label" for="canvas-color-picker">Color</label>
            <input
              class="canvas-color-picker inspector-color-picker--compact"
              id="canvas-color-picker"
              type="color"
              value="#121619"
            />
          </div>
        </section>

        <section class="sidebar-panel frame-panel" aria-labelledby="frame-heading" data-frame-inspector hidden>
          <div class="panel-heading-wrap">
            <h2 class="panel-heading" id="frame-heading">Frame</h2>
          </div>

          <div class="inspector-divider" aria-hidden="true"></div>

          <div class="inspector-field layer-size-field">
            <span class="inspector-label" id="frame-size-label">Size</span>
            <div class="layer-size-row" role="group" aria-labelledby="frame-size-label">
              <label class="prefixed-number-control">
                <span class="number-control-prefix" aria-hidden="true">w</span>
                <input aria-label="Frame width" data-frame-size="width" type="number" min="0" step="1" value="100" />
              </label>
              <label class="prefixed-number-control">
                <span class="number-control-prefix" aria-hidden="true">h</span>
                <input aria-label="Frame height" data-frame-size="height" type="number" min="0" step="1" value="100" />
              </label>
            </div>
          </div>

          <div class="inspector-field">
            <label class="inspector-label" for="frame-direction">Direction</label>
            <div class="inspector-select-wrap">
              <select class="inspector-control inspector-select" id="frame-direction">
                <option value="horizontal" selected>Horizontal</option>
                <option value="vertical">Vertical</option>
              </select>
              <span class="chevron inspector-select-chevron" aria-hidden="true"></span>
            </div>
          </div>

          <div class="inspector-field">
            <label class="inspector-label" for="frame-gap">Gap</label>
            <div class="inspector-combobox-wrap" data-gap-combobox>
              <input
                class="inspector-control inspector-combobox-input"
                id="frame-gap"
                type="text"
                inputmode="decimal"
                value="10px"
                role="combobox"
                aria-autocomplete="none"
                aria-expanded="false"
                aria-controls="frame-gap-menu"
              />
              <button class="inspector-combobox-toggle" type="button" aria-label="Open gap options" aria-expanded="false" data-gap-toggle>
                <span class="chevron inspector-select-chevron" aria-hidden="true"></span>
              </button>
              <div class="inspector-combobox-menu" id="frame-gap-menu" role="listbox" data-gap-menu hidden>
                <button class="inspector-combobox-option" type="button" role="option" data-gap-option="auto">Auto</button>
              </div>
            </div>
          </div>

          <div class="inspector-field frame-padding-field">
            <span class="inspector-label" id="frame-padding-label">Padding</span>
            <div class="frame-padding-grid" role="group" aria-labelledby="frame-padding-label">
              <label class="prefixed-number-control">
                <span class="number-control-prefix" aria-hidden="true">l</span>
                <input aria-label="Left padding" data-frame-padding="left" type="number" min="0" step="1" value="10" />
              </label>
              <label class="prefixed-number-control">
                <span class="number-control-prefix" aria-hidden="true">t</span>
                <input aria-label="Top padding" data-frame-padding="top" type="number" min="0" step="1" value="10" />
              </label>
              <label class="prefixed-number-control">
                <span class="number-control-prefix" aria-hidden="true">r</span>
                <input aria-label="Right padding" data-frame-padding="right" type="number" min="0" step="1" value="10" />
              </label>
              <label class="prefixed-number-control">
                <span class="number-control-prefix" aria-hidden="true">b</span>
                <input aria-label="Bottom padding" data-frame-padding="bottom" type="number" min="0" step="1" value="10" />
              </label>
            </div>
          </div>

          <div class="inspector-field">
            <label class="inspector-label" for="frame-radius">Radius</label>
            <input class="inspector-control" id="frame-radius" type="number" min="0" step="1" value="0" />
          </div>

          <div class="inspector-field">
            <label class="inspector-label" for="frame-color-picker">Color</label>
            <input class="canvas-color-picker inspector-color-picker--compact is-transparent" id="frame-color-picker" type="color" value="#000000" />
          </div>

          <div class="inspector-field">
            <label class="inspector-label" for="frame-html-tag">HTML tag</label>
            <div class="inspector-select-wrap">
              <select class="inspector-control inspector-select" id="frame-html-tag">
                <option value="div" selected>div</option>
                <option value="button">button</option>
              </select>
              <span class="chevron inspector-select-chevron" aria-hidden="true"></span>
            </div>
          </div>
        </section>

        <section class="sidebar-panel text-panel" aria-labelledby="text-heading" data-text-inspector hidden>
          <div class="panel-heading-wrap">
            <h2 class="panel-heading" id="text-heading">Text</h2>
          </div>

          <div class="inspector-divider" aria-hidden="true"></div>

          <div class="inspector-field layer-size-field">
            <span class="inspector-label" id="text-layer-size-label">Size</span>
            <div class="layer-size-row" role="group" aria-labelledby="text-layer-size-label">
              <label class="prefixed-number-control">
                <span class="number-control-prefix" aria-hidden="true">w</span>
                <input aria-label="Text width" data-text-layer-size="width" type="number" min="0" step="1" value="0" />
              </label>
              <label class="prefixed-number-control">
                <span class="number-control-prefix" aria-hidden="true">h</span>
                <input aria-label="Text height" data-text-layer-size="height" type="number" min="0" step="1" value="0" />
              </label>
            </div>
          </div>

          <div class="inspector-field">
            <label class="inspector-label" for="text-font">Font</label>
            <div class="inspector-select-wrap">
              <select class="inspector-control inspector-select" id="text-font">
                <option value="Inter" selected>Inter</option>
              </select>
              <span class="chevron inspector-select-chevron" aria-hidden="true"></span>
            </div>
          </div>

          <div class="inspector-field">
            <label class="inspector-label" for="text-weight">Weight</label>
            <div class="inspector-select-wrap">
              <select class="inspector-control inspector-select" id="text-weight">
                <option value="400" selected>Regular</option>
              </select>
              <span class="chevron inspector-select-chevron" aria-hidden="true"></span>
            </div>
          </div>

          <div class="inspector-field">
            <label class="inspector-label" for="text-size">Size</label>
            <div class="inspector-select-wrap">
              <select class="inspector-control inspector-select" id="text-size">
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12">12</option>
                <option value="13">13</option>
                <option value="14" selected>14</option>
                <option value="15">15</option>
                <option value="16">16</option>
                <option value="20">20</option>
                <option value="24">24</option>
                <option value="32">32</option>
                <option value="36">36</option>
                <option value="40">40</option>
                <option value="48">48</option>
                <option value="64">64</option>
                <option value="96">96</option>
                <option value="128">128</option>
              </select>
              <span class="chevron inspector-select-chevron" aria-hidden="true"></span>
            </div>
          </div>

          <div class="inspector-field inspector-field--color">
            <label class="inspector-label" for="text-line-height">Line height</label>
            <input class="inspector-control" id="text-line-height" type="text" inputmode="decimal" value="Auto" />
          </div>

          <div class="inspector-field">
            <label class="inspector-label" for="text-letter-spacing">Letter spacing</label>
            <input class="inspector-control" id="text-letter-spacing" type="text" inputmode="decimal" value="0%" />
          </div>

          <div class="inspector-field">
            <label class="inspector-label" for="text-color-picker">Color</label>
            <input class="canvas-color-picker" id="text-color-picker" type="color" value="#ffffff" />
          </div>
        </section>
      </aside>
    </main>
  </body>
</html>
