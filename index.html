<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A static design prototype for a user interface component authoring tool."
    />
    <title>Component Authoring Tool</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="project-store.js" defer></script>
    <script src="canvas.js" defer></script>
    <script src="layers.js" defer></script>
    <script src="inspectors.js" defer></script>
    <script src="export.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="authoring-shell">
      <aside class="left-sidebar" aria-label="Component and layer navigation">
        <section class="sidebar-panel components-panel" aria-labelledby="components-heading">
          <div class="panel-heading-wrap">
            <h1 class="panel-heading" id="components-heading">Components</h1>
          </div>

          <div class="contained-list" role="list">
            <div class="contained-list-item is-selected" role="listitem" aria-current="true">
              Button
            </div>
          </div>

          <button class="export-button" type="button" data-export-components>Export</button>
        </section>

        <div
          class="sidebar-divider"
          role="separator"
          aria-label="Resize Components and Layers panels"
          aria-orientation="horizontal"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="50"
        ></div>

        <section class="sidebar-panel layers-panel" aria-labelledby="layers-heading">
          <div class="panel-heading-wrap">
            <h2 class="panel-heading" id="layers-heading">Layers</h2>
          </div>

          <div class="tree-view" role="tree" aria-label="Layers" data-tree-view></div>
        </section>
      </aside>

      <div class="canvas-properties-wrapper">
        <section class="canvas" id="canvas" aria-label="Canvas">
        <div class="canvas-root-stack" data-canvas-root-stack></div>
        <div class="toolbar" role="toolbar" aria-label="Canvas tools">
          <button class="tool-button is-toggled" type="button" aria-label="Select" aria-pressed="true" data-tool="select">
            <svg class="tool-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M27.3393 12.0593L5.33933 4.05933C5.16073 3.99491 4.96748 3.98265 4.78217 4.02401C4.59686 4.06537 4.42715 4.15864 4.29289 4.29289C4.15864 4.42715 4.06537 4.59686 4.02401 4.78217C3.98265 4.96748 3.99491 5.16073 4.05933 5.33933L12.0593 27.3393C12.1292 27.5326 12.2569 27.6997 12.4251 27.8177C12.5933 27.9358 12.7938 27.9992 12.9993 27.9993C13.1996 27.9995 13.3953 27.9396 13.5612 27.8273C13.727 27.7149 13.8552 27.5554 13.9293 27.3693L17.7693 17.7693L27.3693 13.9293C27.5591 13.8574 27.7224 13.7294 27.8377 13.5624C27.953 13.3954 28.0147 13.1973 28.0147 12.9943C28.0147 12.7914 27.953 12.5933 27.8377 12.4263C27.7224 12.2593 27.5591 12.1313 27.3693 12.0593H27.3393ZM16.6293 16.0593L16.2293 16.2193L16.0693 16.6193L12.9993 24.1993L6.66933 6.66933L24.1993 12.9993L16.6293 16.0593Z" fill="currentColor" /></svg>
          </button>
          <button class="tool-button" type="button" aria-label="Frame" aria-pressed="false" data-tool="frame">
            <svg class="tool-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M24 26V28H8V26H24ZM26 24V8C26 6.89543 25.1046 6 24 6H8C6.89543 6 6 6.89543 6 8V24C6 25.1046 6.89543 26 8 26V28C5.79086 28 4 26.2091 4 24V8C4 5.79086 5.79086 4 8 4H24C26.2091 4 28 5.79086 28 8V24C28 26.2091 26.2091 28 24 28V26C25.1046 26 26 25.1046 26 24Z" fill="currentColor" /></svg>
          </button>
          <button class="tool-button" type="button" aria-label="Text" aria-pressed="false" data-tool="text">
            <svg class="tool-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M5 4H27V6H5V4Z" fill="currentColor" /><path d="M15 6H17V28H15V6Z" fill="currentColor" /></svg>
          </button>
          <button class="tool-button" type="button" aria-label="Import SVG" data-vector-import>
            <svg class="tool-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M28,9H14V6H6v8H9V28h2V14h3V11H28ZM12,12H8V8h4Z" fill="currentColor" /><rect width="32" height="32" fill="none" /></svg>
          </button>
          <input type="file" accept=".svg,image/svg+xml" data-vector-file-input hidden />
        </div>
        </section>

        <aside class="right-sidebar" aria-label="Inspector">
        <section class="sidebar-panel page-panel" aria-labelledby="page-heading" data-page-inspector>
          <div class="panel-heading-wrap">
            <h2 class="panel-heading" id="page-heading">Page</h2>
          </div>
          <div class="custom-color-control" data-color-control="canvas">
            <div class="custom-color-value">
              <label class="custom-color-swatch" aria-label="Choose page color">
                <span class="custom-color-swatch-fill" data-color-swatch aria-hidden="true" style="background-color: #121619;"></span>
                <input class="canvas-color-picker" id="canvas-color-picker" type="color" value="#121619" />
              </label>
              <input class="custom-color-hex" type="text" inputmode="text" maxlength="6" value="121619" aria-label="Page color hex value" autocomplete="off" autocapitalize="characters" spellcheck="false" data-color-hex />
            </div>
            <div class="custom-color-divider" aria-hidden="true"></div>
            <div class="custom-color-opacity">
              <input type="text" inputmode="decimal" maxlength="3" value="100" aria-label="Page color opacity" data-color-opacity />
              <span aria-hidden="true">%</span>
            </div>
            <div class="custom-color-divider" aria-hidden="true"></div>
            <button class="custom-color-remove" type="button" aria-label="Remove page color" data-color-remove><span class="subtract-icon" aria-hidden="true"></span></button>
          </div>
        </section>

        <section class="sidebar-panel frame-panel" aria-labelledby="frame-heading" data-frame-inspector hidden>
          <div class="panel-heading-wrap">
            <h2 class="panel-heading" id="frame-heading">Frame</h2>
          </div>

          <div class="inspector-divider" aria-hidden="true"></div>

          <h3 class="inspector-section-title">Layout</h3>

          <div class="frame-direction-field">
            <span class="inspector-label" id="frame-direction-label">Direction</span>
            <div class="frame-direction-toggle" role="group" aria-labelledby="frame-direction-label">
              <button class="frame-direction-option is-selected" type="button" aria-pressed="true" data-frame-direction="horizontal">Horizontal</button>
              <button class="frame-direction-option" type="button" aria-pressed="false" data-frame-direction="vertical">Vertical</button>
            </div>
          </div>

          <div class="inspector-field layer-size-field">
            <span class="inspector-label" id="frame-size-label">Size</span>
            <div class="layer-size-row" role="group" aria-labelledby="frame-size-label">
              <div class="prefixed-number-control size-mode-combobox" data-size-combobox="frame-width">
                <span class="number-control-prefix" aria-hidden="true">w</span>
                <input aria-label="Frame width" data-frame-size="width" type="text" inputmode="decimal" value="100" role="combobox" aria-autocomplete="none" aria-expanded="false" aria-controls="frame-width-size-menu" />
                <button class="inspector-combobox-toggle" type="button" aria-label="Open frame width sizing options" aria-expanded="false" data-size-toggle><span class="chevron inspector-select-chevron" aria-hidden="true"></span></button>
                <div class="inspector-combobox-menu" id="frame-width-size-menu" role="listbox" data-size-menu hidden>
                  <button class="inspector-combobox-option" type="button" role="option" data-size-option="fixed">Fixed</button>
                  <button class="inspector-combobox-option" type="button" role="option" data-size-option="hug">Hug</button>
                  <button class="inspector-combobox-option" type="button" role="option" data-size-option="fill">Fill</button>
                </div>
              </div>
              <div class="prefixed-number-control size-mode-combobox" data-size-combobox="frame-height">
                <span class="number-control-prefix" aria-hidden="true">h</span>
                <input aria-label="Frame height" data-frame-size="height" type="text" inputmode="decimal" value="100" role="combobox" aria-autocomplete="none" aria-expanded="false" aria-controls="frame-height-size-menu" />
                <button class="inspector-combobox-toggle" type="button" aria-label="Open frame height sizing options" aria-expanded="false" data-size-toggle><span class="chevron inspector-select-chevron" aria-hidden="true"></span></button>
                <div class="inspector-combobox-menu" id="frame-height-size-menu" role="listbox" data-size-menu hidden>
                  <button class="inspector-combobox-option" type="button" role="option" data-size-option="fixed">Fixed</button>
                  <button class="inspector-combobox-option" type="button" role="option" data-size-option="hug">Hug</button>
                  <button class="inspector-combobox-option" type="button" role="option" data-size-option="fill">Fill</button>
                </div>
              </div>
            </div>
          </div>

          <div class="frame-alignment-div">
            <div class="frame-alignment-field">
              <span class="inspector-label" id="frame-alignment-label">Alignment</span>
              <div class="frame-alignment-grid" role="group" aria-labelledby="frame-alignment-label" data-frame-alignment-grid data-direction="horizontal">
                <button class="frame-alignment-option is-selected" type="button" aria-label="Align top left" aria-pressed="true" data-frame-alignment="top-left"><span class="alignment-dot" aria-hidden="true"></span><span class="alignment-lines" aria-hidden="true"><span></span><span></span></span></button>
                <button class="frame-alignment-option" type="button" aria-label="Align top center" aria-pressed="false" data-frame-alignment="top-center"><span class="alignment-dot" aria-hidden="true"></span><span class="alignment-lines" aria-hidden="true"><span></span><span></span></span></button>
                <button class="frame-alignment-option" type="button" aria-label="Align top right" aria-pressed="false" data-frame-alignment="top-right"><span class="alignment-dot" aria-hidden="true"></span><span class="alignment-lines" aria-hidden="true"><span></span><span></span></span></button>
                <button class="frame-alignment-option" type="button" aria-label="Align left" aria-pressed="false" data-frame-alignment="center-left"><span class="alignment-dot" aria-hidden="true"></span><span class="alignment-lines" aria-hidden="true"><span></span><span></span></span></button>
                <button class="frame-alignment-option" type="button" aria-label="Align horizontal and vertical center" aria-pressed="false" data-frame-alignment="center"><span class="alignment-dot" aria-hidden="true"></span><span class="alignment-lines" aria-hidden="true"><span></span><span></span></span></button>
                <button class="frame-alignment-option" type="button" aria-label="Align right" aria-pressed="false" data-frame-alignment="center-right"><span class="alignment-dot" aria-hidden="true"></span><span class="alignment-lines" aria-hidden="true"><span></span><span></span></span></button>
                <button class="frame-alignment-option" type="button" aria-label="Align bottom left" aria-pressed="false" data-frame-alignment="bottom-left"><span class="alignment-dot" aria-hidden="true"></span><span class="alignment-lines" aria-hidden="true"><span></span><span></span></span></button>
                <button class="frame-alignment-option" type="button" aria-label="Align bottom" aria-pressed="false" data-frame-alignment="bottom-center"><span class="alignment-dot" aria-hidden="true"></span><span class="alignment-lines" aria-hidden="true"><span></span><span></span></span></button>
                <button class="frame-alignment-option" type="button" aria-label="Align bottom right" aria-pressed="false" data-frame-alignment="bottom-right"><span class="alignment-dot" aria-hidden="true"></span><span class="alignment-lines" aria-hidden="true"><span></span><span></span></span></button>
              </div>
            </div>

            <div class="frame-gap-radius-stack">
              <div class="inspector-field">
                <label class="inspector-label" for="frame-gap">Gap</label>
                <div class="inspector-combobox-wrap" data-gap-combobox>
                  <input
                    class="inspector-control inspector-combobox-input"
                    id="frame-gap"
                    type="text"
                    inputmode="decimal"
                    value="10px"
                    role="combobox"
                    aria-autocomplete="none"
                    aria-expanded="false"
                    aria-controls="frame-gap-menu"
                  />
                  <button class="inspector-combobox-toggle" type="button" aria-label="Open gap options" aria-expanded="false" data-gap-toggle>
                    <span class="chevron inspector-select-chevron" aria-hidden="true"></span>
                  </button>
                  <div class="inspector-combobox-menu" id="frame-gap-menu" role="listbox" data-gap-menu hidden>
                    <button class="inspector-combobox-option" type="button" role="option" data-gap-option="auto">Auto</button>
                  </div>
                </div>
              </div>

              <div class="inspector-field">
                <label class="inspector-label" for="frame-radius">Radius</label>
                <input class="inspector-control" id="frame-radius" type="number" min="0" step="1" value="0" />
              </div>
            </div>
          </div>

          <div class="inspector-field frame-padding-field">
            <span class="inspector-label" id="frame-padding-label">Padding</span>
            <div class="frame-padding-grid" role="group" aria-labelledby="frame-padding-label">
              <label class="prefixed-number-control">
                <span class="number-control-prefix" aria-hidden="true">l</span>
                <input aria-label="Left padding" data-frame-padding="left" type="number" min="0" step="1" value="10" />
              </label>
              <label class="prefixed-number-control">
                <span class="number-control-prefix" aria-hidden="true">t</span>
                <input aria-label="Top padding" data-frame-padding="top" type="number" min="0" step="1" value="10" />
              </label>
              <label class="prefixed-number-control">
                <span class="number-control-prefix" aria-hidden="true">r</span>
                <input aria-label="Right padding" data-frame-padding="right" type="number" min="0" step="1" value="10" />
              </label>
              <label class="prefixed-number-control">
                <span class="number-control-prefix" aria-hidden="true">b</span>
                <input aria-label="Bottom padding" data-frame-padding="bottom" type="number" min="0" step="1" value="10" />
              </label>
            </div>
          </div>

          <div class="inspector-section-divider" aria-hidden="true"></div>
          <h3 class="inspector-section-title">Fill</h3>

          <div class="custom-color-control is-empty" data-color-control="frame-background">
            <div class="custom-color-value">
              <label class="custom-color-swatch" aria-label="Choose frame background color">
                <span class="custom-color-swatch-fill" data-color-swatch aria-hidden="true"></span>
                <input class="canvas-color-picker" id="frame-color-picker" type="color" value="#000000" />
              </label>
              <input class="custom-color-hex" type="text" inputmode="text" maxlength="6" value="" aria-label="Frame background hex value" autocomplete="off" autocapitalize="characters" spellcheck="false" data-color-hex />
            </div>
            <div class="custom-color-divider" aria-hidden="true"></div>
            <div class="custom-color-opacity">
              <input type="text" inputmode="decimal" maxlength="3" value="100" aria-label="Frame background opacity" data-color-opacity />
              <span aria-hidden="true">%</span>
            </div>
            <div class="custom-color-divider" aria-hidden="true"></div>
            <button class="custom-color-remove" type="button" aria-label="Remove frame background color" data-color-remove><span class="subtract-icon" aria-hidden="true"></span></button>
          </div>

          <div class="inspector-section-divider" aria-hidden="true"></div>
          <h3 class="inspector-section-title">Border</h3>

          <div class="custom-color-control is-empty" data-color-control="frame-outline">
            <div class="custom-color-value">
              <label class="custom-color-swatch" aria-label="Choose frame outline color">
                <span class="custom-color-swatch-fill" data-color-swatch aria-hidden="true"></span>
                <input class="canvas-color-picker" id="frame-outline-color-picker" type="color" value="#000000" />
              </label>
              <input class="custom-color-hex" type="text" inputmode="text" maxlength="6" value="" aria-label="Frame outline hex value" autocomplete="off" autocapitalize="characters" spellcheck="false" data-color-hex />
            </div>
            <div class="custom-color-divider" aria-hidden="true"></div>
            <div class="custom-color-opacity">
              <input type="text" inputmode="decimal" maxlength="3" value="100" aria-label="Frame outline opacity" data-color-opacity />
              <span aria-hidden="true">%</span>
            </div>
            <div class="custom-color-divider" aria-hidden="true"></div>
            <button class="custom-color-remove" type="button" aria-label="Remove frame outline color" data-color-remove><span class="subtract-icon" aria-hidden="true"></span></button>
          </div>

          <div class="frame-outline-row">
            <div class="inspector-field">
              <label class="inspector-label" for="frame-outline-position">Position</label>
              <div class="inspector-select-wrap">
                <select class="inspector-control inspector-select" id="frame-outline-position">
                  <option value="inside" selected>Inside</option>
                  <option value="outside">Outside</option>
                  <option value="center">Center</option>
                </select>
                <span class="chevron inspector-select-chevron" aria-hidden="true"></span>
              </div>
            </div>
            <div class="inspector-field">
              <label class="inspector-label" for="frame-outline-weight">Weight</label>
              <input class="inspector-control" id="frame-outline-weight" type="number" min="0" step="1" value="1" />
            </div>
          </div>

          <div class="inspector-field">
            <label class="inspector-label" for="frame-html-tag">HTML tag</label>
            <div class="inspector-select-wrap">
              <select class="inspector-control inspector-select" id="frame-html-tag">
                <option value="div" selected>div</option>
                <option value="button">button</option>
              </select>
              <span class="chevron inspector-select-chevron" aria-hidden="true"></span>
            </div>
          </div>
        </section>

        <section class="sidebar-panel text-panel" aria-labelledby="text-heading" data-text-inspector hidden>
          <div class="panel-heading-wrap">
            <h2 class="panel-heading" id="text-heading">Text</h2>
          </div>

          <div class="inspector-section-group">
            <div class="inspector-divider" aria-hidden="true"></div>

            <h3 class="inspector-section-title">Layout</h3>

          <div class="inspector-field layer-size-field">
            <span class="inspector-label" id="text-layer-size-label">Size</span>
            <div class="layer-size-row" role="group" aria-labelledby="text-layer-size-label">
              <div class="prefixed-number-control size-mode-combobox" data-size-combobox="text-width">
                <span class="number-control-prefix" aria-hidden="true">w</span>
                <input aria-label="Text width" data-text-layer-size="width" type="text" inputmode="decimal" value="Hug" role="combobox" aria-autocomplete="none" aria-expanded="false" aria-controls="text-width-size-menu" />
                <button class="inspector-combobox-toggle" type="button" aria-label="Open text width sizing options" aria-expanded="false" data-size-toggle><span class="chevron inspector-select-chevron" aria-hidden="true"></span></button>
                <div class="inspector-combobox-menu" id="text-width-size-menu" role="listbox" data-size-menu hidden>
                  <button class="inspector-combobox-option" type="button" role="option" data-size-option="fixed">Fixed</button>
                  <button class="inspector-combobox-option" type="button" role="option" data-size-option="hug">Hug</button>
                  <button class="inspector-combobox-option" type="button" role="option" data-size-option="fill">Fill</button>
                </div>
              </div>
              <div class="prefixed-number-control size-mode-combobox" data-size-combobox="text-height">
                <span class="number-control-prefix" aria-hidden="true">h</span>
                <input aria-label="Text height" data-text-layer-size="height" type="text" inputmode="decimal" value="Hug" role="combobox" aria-autocomplete="none" aria-expanded="false" aria-controls="text-height-size-menu" />
                <button class="inspector-combobox-toggle" type="button" aria-label="Open text height sizing options" aria-expanded="false" data-size-toggle><span class="chevron inspector-select-chevron" aria-hidden="true"></span></button>
                <div class="inspector-combobox-menu" id="text-height-size-menu" role="listbox" data-size-menu hidden>
                  <button class="inspector-combobox-option" type="button" role="option" data-size-option="fixed">Fixed</button>
                  <button class="inspector-combobox-option" type="button" role="option" data-size-option="hug">Hug</button>
                  <button class="inspector-combobox-option" type="button" role="option" data-size-option="fill">Fill</button>
                </div>
              </div>
            </div>
          </div>

            <div class="frame-alignment-field text-alignment-field">
            <span class="inspector-label" id="text-alignment-label">Alignment</span>
            <div class="frame-alignment-grid" role="group" aria-labelledby="text-alignment-label">
              <button class="frame-alignment-option is-selected" type="button" aria-label="Align text top left" aria-pressed="true" data-text-alignment="top-left"><span class="alignment-dot" aria-hidden="true"></span><span class="alignment-lines" aria-hidden="true"><span></span><span></span></span></button>
              <button class="frame-alignment-option" type="button" aria-label="Align text top center" aria-pressed="false" data-text-alignment="top-center"><span class="alignment-dot" aria-hidden="true"></span><span class="alignment-lines" aria-hidden="true"><span></span><span></span></span></button>
              <button class="frame-alignment-option" type="button" aria-label="Align text top right" aria-pressed="false" data-text-alignment="top-right"><span class="alignment-dot" aria-hidden="true"></span><span class="alignment-lines" aria-hidden="true"><span></span><span></span></span></button>
              <button class="frame-alignment-option" type="button" aria-label="Align text vertically centered left" aria-pressed="false" data-text-alignment="center-left"><span class="alignment-dot" aria-hidden="true"></span><span class="alignment-lines" aria-hidden="true"><span></span><span></span></span></button>
              <button class="frame-alignment-option" type="button" aria-label="Align text vertically and horizontally centered" aria-pressed="false" data-text-alignment="center"><span class="alignment-dot" aria-hidden="true"></span><span class="alignment-lines" aria-hidden="true"><span></span><span></span></span></button>
              <button class="frame-alignment-option" type="button" aria-label="Align text vertically centered right" aria-pressed="false" data-text-alignment="center-right"><span class="alignment-dot" aria-hidden="true"></span><span class="alignment-lines" aria-hidden="true"><span></span><span></span></span></button>
              <button class="frame-alignment-option" type="button" aria-label="Align text bottom left" aria-pressed="false" data-text-alignment="bottom-left"><span class="alignment-dot" aria-hidden="true"></span><span class="alignment-lines" aria-hidden="true"><span></span><span></span></span></button>
              <button class="frame-alignment-option" type="button" aria-label="Align text bottom center" aria-pressed="false" data-text-alignment="bottom-center"><span class="alignment-dot" aria-hidden="true"></span><span class="alignment-lines" aria-hidden="true"><span></span><span></span></span></button>
              <button class="frame-alignment-option" type="button" aria-label="Align text bottom right" aria-pressed="false" data-text-alignment="bottom-right"><span class="alignment-dot" aria-hidden="true"></span><span class="alignment-lines" aria-hidden="true"><span></span><span></span></span></button>
            </div>
            </div>
          </div>

          <div class="inspector-section-group">
            <div class="inspector-section-divider" aria-hidden="true"></div>
            <h3 class="inspector-section-title">Typography</h3>

          <div class="inspector-field text-font-field">
            <label class="inspector-label" for="text-font">Font</label>
            <div class="inspector-select-wrap">
              <select class="inspector-control inspector-select" id="text-font">
                <option value="Inter" selected>Inter</option>
              </select>
              <span class="chevron inspector-select-chevron" aria-hidden="true"></span>
            </div>
          </div>

          <div class="text-inspector-row">
          <div class="inspector-field">
            <label class="inspector-label" for="text-weight">Weight</label>
            <div class="inspector-select-wrap">
              <select class="inspector-control inspector-select" id="text-weight">
                <option value="400" selected>Regular</option>
              </select>
              <span class="chevron inspector-select-chevron" aria-hidden="true"></span>
            </div>
          </div>

          <div class="inspector-field">
            <label class="inspector-label" for="text-size">Size</label>
            <div class="inspector-select-wrap">
              <select class="inspector-control inspector-select" id="text-size">
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12">12</option>
                <option value="13">13</option>
                <option value="14" selected>14</option>
                <option value="15">15</option>
                <option value="16">16</option>
                <option value="20">20</option>
                <option value="24">24</option>
                <option value="32">32</option>
                <option value="36">36</option>
                <option value="40">40</option>
                <option value="48">48</option>
                <option value="64">64</option>
                <option value="96">96</option>
                <option value="128">128</option>
              </select>
              <span class="chevron inspector-select-chevron" aria-hidden="true"></span>
            </div>
          </div>
          </div>

          <div class="text-inspector-row">
          <div class="inspector-field">
            <label class="inspector-label" for="text-line-height">Line height</label>
            <input class="inspector-control" id="text-line-height" type="text" inputmode="decimal" value="Auto" />
          </div>

          <div class="inspector-field">
            <label class="inspector-label" for="text-letter-spacing">Letter spacing</label>
            <input class="inspector-control" id="text-letter-spacing" type="text" inputmode="decimal" value="0%" />
          </div>
          </div>
          </div>

          <div class="inspector-section-group">
            <h3 class="inspector-section-title">Fill</h3>
            <div class="inspector-section-divider" aria-hidden="true"></div>
            <div class="custom-color-control" data-color-control="text">
            <div class="custom-color-value">
              <label class="custom-color-swatch" aria-label="Choose text color">
                <span class="custom-color-swatch-fill" data-color-swatch aria-hidden="true" style="background-color: #ffffff;"></span>
                <input class="canvas-color-picker" id="text-color-picker" type="color" value="#ffffff" />
              </label>
              <input class="custom-color-hex" type="text" inputmode="text" maxlength="6" value="FFFFFF" aria-label="Text color hex value" autocomplete="off" autocapitalize="characters" spellcheck="false" data-color-hex />
            </div>
            <div class="custom-color-divider" aria-hidden="true"></div>
            <div class="custom-color-opacity">
              <input type="text" inputmode="decimal" maxlength="3" value="100" aria-label="Text color opacity" data-color-opacity />
              <span aria-hidden="true">%</span>
            </div>
            <div class="custom-color-divider" aria-hidden="true"></div>
            <button class="custom-color-remove" type="button" aria-label="Remove text color" data-color-remove><span class="subtract-icon" aria-hidden="true"></span></button>
            </div>
          </div>
        </section>

        <section class="sidebar-panel vector-panel" aria-labelledby="vector-heading" data-vector-inspector hidden>
          <div class="panel-heading-wrap">
            <h2 class="panel-heading" id="vector-heading">Vector</h2>
          </div>

          <div class="inspector-section-group">
            <div class="inspector-divider" aria-hidden="true"></div>

            <h3 class="inspector-section-title">Layout</h3>

          <div class="inspector-field layer-size-field">
            <span class="inspector-label" id="vector-size-label">Size</span>
            <div class="layer-size-row" role="group" aria-labelledby="vector-size-label">
              <label class="prefixed-number-control">
                <span class="number-control-prefix" aria-hidden="true">w</span>
                <input aria-label="Vector width" data-vector-size="width" type="number" min="0" step="1" value="24" />
              </label>
              <label class="prefixed-number-control">
                <span class="number-control-prefix" aria-hidden="true">h</span>
                <input aria-label="Vector height" data-vector-size="height" type="number" min="0" step="1" value="24" />
              </label>
            </div>
          </div>
          </div>

          <div class="inspector-section-group">
            <h3 class="inspector-section-title">Fill</h3>
            <div class="inspector-section-divider" aria-hidden="true"></div>
            <div class="custom-color-control" data-color-control="vector">
            <div class="custom-color-value">
              <label class="custom-color-swatch" aria-label="Choose vector color">
                <span class="custom-color-swatch-fill" data-color-swatch aria-hidden="true" style="background-color: #000000;"></span>
                <input class="canvas-color-picker" id="vector-color-picker" type="color" value="#000000" />
              </label>
              <input class="custom-color-hex" type="text" inputmode="text" maxlength="6" value="000000" aria-label="Vector color hex value" autocomplete="off" autocapitalize="characters" spellcheck="false" data-color-hex />
            </div>
            <div class="custom-color-divider" aria-hidden="true"></div>
            <div class="custom-color-opacity">
              <input type="text" inputmode="decimal" maxlength="3" value="100" aria-label="Vector color opacity" data-color-opacity />
              <span aria-hidden="true">%</span>
            </div>
            <div class="custom-color-divider" aria-hidden="true"></div>
            <button class="custom-color-remove" type="button" aria-label="Remove vector color" data-color-remove><span class="subtract-icon" aria-hidden="true"></span></button>
            </div>
          </div>
        </section>
        </aside>

      <section class="props-panel" aria-label="Component properties">
        <div class="props-toolbar">
          <button class="add-prop-button" type="button" data-add-prop>
            <span class="plus-icon" aria-hidden="true"></span>
            <span>Add prop</span>
          </button>
        </div>

        <div class="props-table" role="table" aria-label="Props">
          <div class="props-table-row props-table-header" role="row">
            <div class="props-table-cell" role="columnheader">Name</div>
            <div class="props-table-cell" role="columnheader">Type</div>
            <div class="props-table-cell" role="columnheader">Default</div>
            <div class="props-table-cell" role="columnheader">Target</div>
            <div class="props-table-cell" role="columnheader">Property</div>
            <div class="props-table-cell props-table-action-cell" role="columnheader"><span class="sr-only">Actions</span></div>
          </div>
          <div class="props-table-body" role="rowgroup" data-prop-rows></div>
        </div>
      </section>
      </div>
    </main>
  </body>
</html>
